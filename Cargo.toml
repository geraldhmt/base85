[package]
name = "base85"
version = "2.1.0"
authors = ["Jon Yoder <jon@yoder.cloud>"]
edition = "2021"
description = "A fast library for Base85 encoding as described in RFC1924"
readme = "README.md"
homepage = "https://github.com/geraldhmt/base85"
repository = "https://github.com/geraldhmt/base85"
license = "MPL-2.0-no-copyleft-exception"
keywords = ["base85", "rfc1924", "encode", "decode"]
categories = ["encoding"]
exclude = [".gitignore"]
[features]
only_safe = [ # penality of 3 to 8 % perf (and more on very small packet)  
]

[dependencies]
thiserror = { version = "2.0.0", default-features = false }

[dev-dependencies]
rand = { version = "0.10.1", features = ["thread_rng"] }
anyhow = "1.0.103"
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "encode_noalloc"
harness = false
